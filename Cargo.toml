[package]
name = "rsc"
version = "0.0.1"
edition = "2024"
description = "Multi-agent deep research in your terminal, powered by your ChatGPT plan"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sbharga/rsc"
readme = "README.md"
keywords = ["research", "tui", "chatgpt", "agents", "ratatui"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
anyhow = "1"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "7"
futures-util = "0.3"
html2text = "0.17"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
open = "5"
pdf-extract = "0.12"
rand = "0.10"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
ratatui-textarea = "0.9"
reqwest = { version = "0.13", features = ["json", "stream", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "1"
tui-markdown = "0.3"
unicode-width = "0.2"
url = "2"
uuid = { version = "1", features = ["v4"] }
