name: Release
on:
  release:
    types: [published]
  workflow_dispatch: # dry run: build, sign and verify without touching a release
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, smoke: true }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, smoke: true }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-musl, smoke: true }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-musl, smoke: true }
          - { os: macos-latest, target: aarch64-apple-darwin, smoke: true }
          - { os: macos-latest, target: x86_64-apple-darwin, smoke: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, smoke: true }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, smoke: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_$(echo '${{ matrix.target }}' | tr '-' '_')=musl-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke
        if: matrix.smoke
        shell: bash
        run: target/${{ matrix.target }}/release/rsc --version
      - name: Package
        shell: bash
        run: |
          name=rsc-${{ matrix.target }}
          mkdir -p "$name" dist
          cp LICENSE-MIT LICENSE-APACHE README.md "$name"/
          case "${{ matrix.target }}" in
            *windows*)
              cp target/${{ matrix.target }}/release/rsc.exe "$name"/
              asset=$name.zip
              7z a -tzip "dist/$asset" "$name" >/dev/null ;;
            *)
              cp target/${{ matrix.target }}/release/rsc "$name"/
              asset=$name.tar.gz
              tar -czf "dist/$asset" "$name" ;;
          esac
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "$asset"; else shasum -a 256 "$asset"; fi > "$asset.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: rsc-${{ matrix.target }}
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # cosign keyless signing via GitHub OIDC
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: rsc-*
          merge-multiple: true
      - uses: sigstore/cosign-installer@v4.1.3
      - name: Checksums
        run: cd dist && sha256sum -c *.sha256
      - name: Sign
        run: |
          for f in dist/*.tar.gz dist/*.zip; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Verify signatures
        run: |
          for f in dist/*.tar.gz dist/*.zip; do
            cosign verify-blob "$f" --bundle "$f.sigstore.json" \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
      - uses: actions/upload-artifact@v7
        with:
          name: signed
          path: dist/
      - name: Upload
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* install.sh install.ps1 --clobber
      - name: Release notes
        if: github.event_name == 'release'
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name }}"
          awk -v v="${tag#v}" '$0 == "## " v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "No CHANGELOG.md entry for $tag" >&2; exit 1; }
          gh release edit "$tag" --notes-file notes.md
