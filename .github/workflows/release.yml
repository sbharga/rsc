name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=rsc-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/rsc LICENSE-MIT LICENSE-APACHE README.md "$name"/
          tar -czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz"; else shasum -a 256 "$name.tar.gz"; fi > "$name.tar.gz.sha256"
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" rsc-${{ matrix.target }}.tar.gz rsc-${{ matrix.target }}.tar.gz.sha256 --clobber
  notes:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Attach install.sh
        run: gh release upload "${{ github.event.release.tag_name }}" install.sh --clobber
      - name: Release notes
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name }}"
          awk -v v="${tag#v}" '$0 == "## " v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "No CHANGELOG.md entry for $tag" >&2; exit 1; }
          gh release edit "$tag" --notes-file notes.md
